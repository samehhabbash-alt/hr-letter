<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Letter Request For Embassies</title>
<style>
:root{--bg:#f5f4fa;--card:#fff;--tx:#1d1b2e;--mu:#6b6882;--pr:#4b3fa0;--bd:#d9d6e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131f;--card:#201d30;--tx:#f1effa;--mu:#a29ebd;--pr:#8c80f0;--bd:#38344f}}
:root[data-theme="dark"]{--bg:#15131f;--card:#201d30;--tx:#f1effa;--mu:#a29ebd;--pr:#8c80f0;--bd:#38344f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 4px}p.s{color:var(--mu);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
label{display:block;font-size:14px;font-weight:bold;margin:14px 0 6px}
label small{font-weight:normal;color:var(--mu)}
input,select{width:100%;box-sizing:border-box;font-size:16px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:10px}.row>div{flex:1}
button{width:100%;margin-top:20px;padding:14px;font-size:16px;font-weight:bold;border:0;border-radius:10px;background:var(--pr);color:#fff}
#msg{margin-top:12px;font-size:14px;color:var(--mu);min-height:20px}
</style>
</head>
<body>
<main>
<h1>HR Letter Request For Embassies</h1>
<p class="s">Fill in your details exactly as in your passport, then tap the button to get an editable Word letter.</p>
<div class="card">
<label>Title</label>
<select id="title"><option>Mr.</option><option>Ms.</option></select>
<label>Full name <small>(as in passport)</small></label>
<input id="name" autocomplete="name" placeholder="e.g. Ahmed Mohamed Ali Hassan">
<label>Passport number</label>
<input id="pass" autocapitalize="characters" placeholder="e.g. A12345678">
<label>Job title</label>
<input id="job" placeholder="e.g. Customer Service Specialist">
<label>Hiring date at Telecom Egypt</label>
<input id="hire" type="date">
<label>Net monthly salary <small>(EGP)</small></label>
<input id="sal" type="number" inputmode="decimal" placeholder="e.g. 12355.84">
<label>Purpose of travel</label>
<select id="purpose"><option value="business trip">Business trip</option><option value="private trip">Private trip</option><option value="tourism trip">Tourism</option></select>
<label>Destination country <small>(Embassy of ...)</small></label>
<input id="country" value="France">
<div class="row">
<div><label>Departure</label><input id="from" type="date"></div>
<div><label>Return</label><input id="to" type="date"></div>
</div>
<button id="go">Create Word letter</button>
<div id="msg"></div>
</div>
</main>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const pd=v=>{const[a,b,c]=v.split("-").map(Number);return new Date(a,b-1,c)};
const fmt=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
function run(t,o={}){return `<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${o.b?"<w:b/>":""}${o.color?`<w:color w:val="${o.color}"/>`:""}<w:sz w:val="${o.sz||22}"/></w:rPr><w:t xml:space="preserve">${esc(t)}</w:t></w:r>`}
function p(t,o={}){return `<w:p><w:pPr><w:spacing w:before="${o.before??0}" w:after="${o.after??200}" w:line="300" w:lineRule="auto"/><w:jc w:val="${o.al||"left"}"/></w:pPr>${t===""?"":run(t,o)}</w:p>`}
async function build(d){
const he=d.title==="Mr."?"He":"She",his=d.title==="Mr."?"his":"her",him=d.title==="Mr."?"him":"her";
const hd=pd(d.hire),hire=hd.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
const sal=Number(d.sal).toLocaleString("en-US",{maximumFractionDigits:2});
const today=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const body=[
p(today,{al:"right",before:240,after:480}),
p("His Excellency Consul",{after:60}),p("Embassy of "+d.country,{after:60}),p("Cairo, Egypt",{after:300}),
p("Dear Sir,"),
p(`Telecom Egypt extends its compliments to your esteemed Embassy and requests your assistance in issuing an entry visa for ${d.title} ${d.name}, Passport No. ${d.pass}. ${he} is ${d.job} in Telecom Egypt. ${he} was appointed at Telecom Egypt in ${hire} and ${his} net monthly salary is LE${sal}.`,{al:"both"}),
p(`Telecom Egypt would be grateful if you could issue an entry visa for ${d.title} ${d.name} as ${he.toLowerCase()} will be travelling to ${d.country} on a ${d.purpose} from ${fmt(pd(d.from))} to ${fmt(pd(d.to))}.`,{al:"both"}),
p(`This letter has been given to ${him} upon ${his} own responsibility without any liability on Telecom Egypt.`,{al:"both"}),
p("Thank you for your continuous assistance to Telecom Egypt and if you need any further information or clarification please do not hesitate to contact me.",{al:"both"}),
p("Best Regards,",{after:700}),
p("Heba Osman",{b:true,after:60}),p("General Manager Travel",{after:60}),p("Office of Vice President H.R",{after:60}),p("Tel: (+202)31317771.",{after:60}),p("Email: heba.osman@te.eg",{after:60})
].join("");
const z=await JSZip.loadAsync(LETTERHEAD,{base64:true});
let x=await z.file("word/document.xml").async("string");
x=x.replace(/(<w:body>)[\s\S]*?(<w:sectPr)/,(m,a,b)=>a+body+b);
z.file("word/document.xml",x);
return z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
$("go").onclick=async()=>{
const d={};["title","name","pass","job","hire","sal","purpose","country","from","to"].forEach(k=>d[k]=$(k).value.trim());
const msg=$("msg");
if(Object.values(d).some(v=>!v)){msg.textContent="Please fill in all the fields.";return}
if(pd(d.to)<pd(d.from)){msg.textContent="Return date must be after departure date.";return}
try{
const blob=await build(d);
const fn="HR_Letter_"+d.name.replace(/[^A-Za-z0-9]+/g,"_")+".docx";
let dl=null;
try{if(typeof claude!=="undefined")dl=await claude.use("downloads")}catch(_){}
if(dl){await dl.save({filename:fn,data:blob})}
else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove()}
msg.textContent="Done. Open the file in Word or Google Docs to edit and print.";
}catch(e){msg.textContent=e&&e.code==="declined"?"Save cancelled.":"Something went wrong, please try again."}
};
</script>
